<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesso à plataforma Nexus">
  <title>Nexus — Login</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand">NEXUS</div>
      <h1 id="login-title">Acessar</h1>
      <p>Entre com suas credenciais para continuar.</p>

      <form id="auth-form">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required placeholder="seu@email.com">

        <div class="password-label">
          <label for="password">Senha</label>
          <button id="show-password" type="button">Ver senha</button>
        </div>
        <input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="••••••••">

        <button id="submit" class="submit" type="submit">Entrar</button>
        <output id="feedback" aria-live="polite"></output>
      </form>

      <small>Acesso restrito</small>
    </section>
  </main>
</body>
</html>
