<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesso à plataforma Nexus">
  <title>Nexus — Login</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand">NEXUS</div>
      <h1 id="login-title">Acessar</h1>
      <p>Entre com suas credenciais para continuar.</p>

      <form id="auth-form">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required placeholder="seu@email.com">

        <div class="password-label">
          <label for="password">Senha</label>
          <button id="show-password" type="button">Ver senha</button>
        </div>
        <input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="••••••••">

        <button id="submit" class="submit" type="submit">Entrar</button>
        <output id="feedback" aria-live="polite"></output>
      </form>

      <small>Acesso restrito</small>
    </section>
  </main>
  <main id="app" class="messenger" hidden><aside class="app-nav"><b>N</b><button id="profile-button">◉</button><button id="logout">↪</button></aside><section class="contacts"><header><div><small>MINHA REDE</small><h2>Conversas</h2></div><img id="my-avatar" alt="Meu perfil"></header><form id="friend-form" class="invite-form"><input id="friend-code" maxlength="8" placeholder="Código de convite"><button>+</button></form><output id="friend-feedback"></output><div id="friend-list" class="contact-list"></div><footer>Seu código: <strong id="invite-code">--------</strong><button id="copy-code">Copiar</button></footer></section><section class="conversation"><div id="empty-chat" class="empty-chat"><b>NEXUS</b><p>Selecione um amigo para iniciar uma conversa segura.</p></div><div id="active-chat" class="active-chat" hidden><header><img id="chat-avatar" alt=""><div><strong id="chat-name"></strong><small>conexão ativa</small></div></header><div id="messages" class="messages"></div><form id="message-form" class="composer"><input id="message" maxlength="2000" placeholder="Digite uma mensagem..." required><button>Enviar</button></form></div></section><dialog id="profile-dialog"><button id="close-profile">×</button><h2>Meu perfil</h2><label class="avatar-picker"><img id="profile-avatar" alt="Foto"><span>Alterar foto</span><input id="avatar-input" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><form id="profile-form"><label>Nome<input id="display-name" maxlength="30" required></label><button>Salvar</button><output id="profile-feedback"></output></form></dialog></main>
</body>
</html>
